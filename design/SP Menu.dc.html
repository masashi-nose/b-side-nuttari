<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D9D2C2;font-family:"Zen Kaku Gothic New",sans-serif;color:#1B1B1B}
a{color:#1B1B1B}a:hover{color:#22388F}
button{font-family:inherit;color:#1B1B1B}
:focus-visible{outline:3px solid #22388F;outline-offset:2px}
</style>
</helmet>
<div style="display: flex; gap: 80px; align-items: flex-start; padding: 64px; width: max-content">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.08em"><span style="padding: 3px 8px; background: #1B1B1B; color: #F7F3EA">SP</span><span>メニューを開いた状態 — 390×844</span></div>
<div data-screen-label="スマホメニュー" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F3EA; color: #1B1B1B; font-family: 'Zen Kaku Gothic New', sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px">
<a href="Top.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #22388F; color: #F7F3EA; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 16px">B</span>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 18px">B SIDE NUTTARI</span>
</a>
<button type="button" aria-label="メニューを開く" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="width: 48px; height: 48px; border: 2px solid #1B1B1B; border-radius: 50%; background: #F7F3EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="#1B1B1B" stroke-width="2.4" stroke-linecap="round"><line x1="1" y1="2" x2="19" y2="2"></line><line x1="1" y1="12" x2="19" y2="12"></line></svg>
</button>
</header>
<div style="margin: 4px 16px 0; height: 520px; border: 3px solid #1B1B1B; border-radius: 20px; box-shadow: 5px 5px 0 #1B1B1B; background: #D9D2C2; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #4A453C">[トップページ：カルーセル]</div>
<div style="padding: 40px 20px; font-family: 'Dela Gothic One', sans-serif; font-size: 48px; line-height: 1.25; color: #22388F">沼垂の、<br>すぐそばに。</div>

<div role="dialog" aria-modal="true" aria-label="メニュー" style="position: absolute; inset: 0; background: #F7F3EA; display: flex; flex-direction: column; transform: {{ panelT }}; transition: transform .3s ease; visibility: {{ panelVis }}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px">
<a href="Top.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #22388F; color: #F7F3EA; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 16px">B</span>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 18px">B SIDE NUTTARI</span>
</a>
<button type="button" aria-label="メニューを閉じる" onClick="{{ toggle }}" style="width: 48px; height: 48px; border: 2px solid #1B1B1B; border-radius: 50%; background: #1B1B1B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#F7F3EA" stroke-width="2.4" stroke-linecap="round"><line x1="2" y1="2" x2="16" y2="16"></line><line x1="16" y1="2" x2="2" y2="16"></line></svg>
</button>
</div>
<nav aria-label="メイン" style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="4">
<a href="{{ n.href }}" aria-current="{{ n.current }}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 0 20px; background: {{ n.bg }}; color: {{ n.fg }}; border: 3px solid #1B1B1B; border-radius: 16px; box-shadow: 4px 4px 0 #1B1B1B; text-decoration: none">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.14em">{{ n.en }}</span>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">{{ n.label }}</span>
</span>
<span aria-hidden="true" style="font-size: 20px; font-weight: 700">→</span>
</a>
</sc-for>
</nav>
<div style="margin: 28px 16px 0; padding: 20px; background: #D9782D; border: 3px solid #1B1B1B; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 17px; line-height: 1.45">新潟駅から、<br>歩いて沼垂へ。</span>
<a href="Access.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 20px; background: #1B1B1B; color: #F7F3EA; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px; flex-shrink: 0">行き方を見る</a>
</div>
<div style="margin-top: auto; padding: 20px; border-top: 3px solid #1B1B1B; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 20px; font-size: 13px; font-weight: 700"><a href="About.dc.html#pc-contact" style="display: inline-flex; align-items: center; min-height: 44px">お問い合わせ</a><a href="#" style="display: inline-flex; align-items: center; min-height: 44px">プライバシーポリシー</a></div>
<p style="margin: 0; font-size: 11px; line-height: 1.7">このサイトは沼垂テラス商店街の公式サイトではありません。</p>
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;なし（トップ）&quot;,&quot;お店・スポット&quot;,&quot;読みもの&quot;,&quot;アクセス&quot;,&quot;このサイトについて&quot;],&quot;default&quot;:&quot;なし（トップ）&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;現在地&quot;}}">
const ITEMS = [
  { label: 'お店・スポット', en: 'SPOTS', href: 'Spots%20List.dc.html' },
  { label: '読みもの', en: 'ARTICLES', href: 'Articles%20List.dc.html' },
  { label: 'アクセス', en: 'ACCESS', href: 'Access.dc.html' },
  { label: 'このサイトについて', en: 'ABOUT', href: 'About.dc.html' }
];
class Component extends DCLogic {
  state = { open: true };
  renderVals() {
    const open = this.state.open;
    const cur = this.props.current ?? 'なし（トップ）';
    return {
      open,
      toggle: () => this.setState((s) => ({ open: !s.open })),
      panelT: open ? 'translateX(0)' : 'translateX(100%)',
      panelVis: open ? 'visible' : 'hidden',
      items: ITEMS.map((n) => ({ ...n, current: n.label === cur ? 'page' : undefined,
        bg: n.label === cur ? '#1B1B1B' : '#FFFFFF', fg: n.label === cur ? '#F7F3EA' : '#1B1B1B' }))
    };
  }
}
</script>
</body>
</html>
